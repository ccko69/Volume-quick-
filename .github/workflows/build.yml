name: Build APK (no cache)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Print Java and Gradle info
        run: |
          java -version
          if [ -f "./gradlew" ]; then
            ./gradlew --version || true
          fi

      - name: Build (assembleDebug) using Gradle wrapper
        # Prefer gradlew if present; otherwise try to run Gradle via npx gradle or installed gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # Fallback if you don't include gradlew (not recommended) — install gradle via sdkman
            sudo apt-get update && sudo apt-get install -y unzip
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 7.4.2
            gradle assembleDebug --no-daemon --stacktrace
          fi
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF8"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
